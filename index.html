    <script>
        const fileMarkdown = "# 30 \u043c\u0438\u043d\u0438-\u043f\u0440\u0438\u043c\u0435\u0440\u043e\u0432 \u0440\u0430\u0431\u043e\u0442\u044b \u0441 \u0444\u0430\u0439\u043b\u0430\u043c\u0438 \u043d\u0430 C++ \u0441 \u043a\u043e\u043c\u043c\u0435\u043d\u0442\u0430\u0440\u0438\u044f\u043c\u0438 \u043d\u0430 \u0440\u0443\u0441\u0441\u043a\u043e\u043c:\n\n## \u0417\u0410\u041f\u0418\u0421\u042c \u0412 \u0424\u0410\u0419\u041b\n### 1. \u041f\u0440\u043e\u0441\u0442\u0430\u044f \u0437\u0430\u043f\u0438\u0441\u044c \u0432 \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u044b\u0439 \u0444\u0430\u0439\u043b\n\n```cpp\n#include <fstream>\nint main() {\n    std::ofstream f(\"test.txt\");\n    f << \"\u041f\u0440\u0438\u0432\u0435\u0442, \u043c\u0438\u0440!\";\n    f.close();\n}\n```\n\n### 2. \u0417\u0430\u043f\u0438\u0441\u044c \u0441 \u043f\u0440\u043e\u0432\u0435\u0440\u043a\u043e\u0439 \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u044f\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ofstream f(\"data.txt\");\n    if (f.is_open()) {\n        f << 42 << \" \" << 3.14;\n        f.close();\n    } else std::cout << \"\u041e\u0448\u0438\u0431\u043a\u0430!\";\n}\n```\n\n### 3. \u0414\u043e\u0437\u0430\u043f\u0438\u0441\u044c \u0432 \u043a\u043e\u043d\u0435\u0446 \u0444\u0430\u0439\u043b\u0430 (append)\n\n```cpp\n#include <fstream>\nint main() {\n    std::ofstream f(\"log.txt\", std::ios::app);\n    f << \"\u041d\u043e\u0432\u0430\u044f \u0441\u0442\u0440\u043e\u043a\u0430\\n\";\n    f.close();\n}\n```\n\n### 4. \u0417\u0430\u043f\u0438\u0441\u044c \u043c\u0430\u0441\u0441\u0438\u0432\u0430 \u0447\u0438\u0441\u0435\u043b\n\n```cpp\n#include <fstream>\nint main() {\n    std::ofstream f(\"nums.txt\");\n    int arr[] = {1, 2, 3, 4, 5};\n    for (int x : arr) f << x << \" \";\n    f.close();\n}\n```\n\n### 5. \u0417\u0430\u043f\u0438\u0441\u044c \u0441 \u0444\u043e\u0440\u043c\u0430\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435\u043c\n\n```cpp\n#include <fstream>\n#include <iomanip>\nint main() {\n    std::ofstream f(\"format.txt\");\n    f << std::setw(10) << \"\u0418\u043c\u044f\" << std::setw(5) << \"\u0412\u043e\u0437\u0440\u0430\u0441\u0442\\n\";\n    f << std::setw(10) << \"\u0410\u043d\u043d\u0430\" << std::setw(5) << 25;\n    f.close();\n}\n```\n\n## \u0427\u0422\u0415\u041d\u0418\u0415 \u0418\u0417 \u0424\u0410\u0419\u041b\u0410\n### 6. \u0427\u0442\u0435\u043d\u0438\u0435 \u0432\u0441\u0435\u0433\u043e \u0444\u0430\u0439\u043b\u0430 \u043f\u043e\u0441\u0442\u0440\u043e\u0447\u043d\u043e\n\n```cpp\n#include <fstream>\n#include <iostream>\n#include <string>\nint main() {\n    std::ifstream f(\"test.txt\");\n    std::string line;\n    while (getline(f, line)) std::cout << line << \"\\n\";\n    f.close();\n}\n```\n\n### 7. \u0427\u0442\u0435\u043d\u0438\u0435 \u0447\u0438\u0441\u0435\u043b \u0438\u0437 \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"nums.txt\");\n    int x;\n    while (f >> x) std::cout << x << \" \";\n    f.close();\n}\n```\n\n### 8. \u0427\u0442\u0435\u043d\u0438\u0435 \u043f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 \u0441\u0438\u043c\u0432\u043e\u043b\u0443\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    char ch;\n    while (f.get(ch)) std::cout << ch;\n    f.close();\n}\n```\n\n### 9. \u0427\u0442\u0435\u043d\u0438\u0435 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u0430 \u0431\u0430\u0439\u0442\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"data.txt\");\n    char buf[100];\n    f.read(buf, 100);\n    std::cout << \"\u041f\u0440\u043e\u0447\u0438\u0442\u0430\u043d\u043e: \" << f.gcount() << \" \u0431\u0430\u0439\u0442\";\n    f.close();\n}\n```\n\n### 10. \u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043e\u0432\u0430\u043d\u0438\u044f \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"unknown.txt\");\n    if (f) std::cout << \"\u0424\u0430\u0439\u043b \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u0435\u0442\";\n    else std::cout << \"\u0424\u0430\u0439\u043b \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\";\n}\n```\n\n## \u0411\u0418\u041d\u0410\u0420\u041d\u042b\u0415 \u0424\u0410\u0419\u041b\u042b\n### 11. \u0417\u0430\u043f\u0438\u0441\u044c \u0432 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0439 \u0444\u0430\u0439\u043b\n\n```cpp\n#include <fstream>\nint main() {\n    int x = 12345;\n    std::ofstream f(\"bin.dat\", std::ios::binary);\n    f.write((char*)&x, sizeof(x));\n    f.close();\n}\n```\n\n### 12. \u0427\u0442\u0435\u043d\u0438\u0435 \u0438\u0437 \u0431\u0438\u043d\u0430\u0440\u043d\u043e\u0433\u043e \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    int x;\n    std::ifstream f(\"bin.dat\", std::ios::binary);\n    f.read((char*)&x, sizeof(x));\n    std::cout << x;\n    f.close();\n}\n```\n\n### 13. \u0417\u0430\u043f\u0438\u0441\u044c \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u0432 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0439 \u0444\u0430\u0439\u043b\n\n```cpp\n#include <fstream>\nstruct Point { int x, y; };\nint main() {\n    Point p{10, 20};\n    std::ofstream f(\"point.bin\", std::ios::binary);\n    f.write((char*)&p, sizeof(p));\n    f.close();\n}\n```\n\n### 14. \u0427\u0442\u0435\u043d\u0438\u0435 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u0438\u0437 \u0431\u0438\u043d\u0430\u0440\u043d\u043e\u0433\u043e \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nstruct Point { int x, y; };\nint main() {\n    Point p;\n    std::ifstream f(\"point.bin\", std::ios::binary);\n    f.read((char*)&p, sizeof(p));\n    std::cout << p.x << \", \" << p.y;\n    f.close();\n}\n```\n\n### 15. \u0417\u0430\u043f\u0438\u0441\u044c \u0432\u0435\u043a\u0442\u043e\u0440\u0430 \u0447\u0438\u0441\u0435\u043b \u0432 \u0431\u0438\u043d\u0430\u0440\u043d\u044b\u0439 \u0444\u0430\u0439\u043b\n\n```cpp\n#include <fstream>\n#include <vector>\nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n    std::ofstream f(\"vec.bin\", std::ios::binary);\n    f.write((char*)v.data(), v.size() * sizeof(int));\n    f.close();\n}\n```\n\n## \u041f\u041e\u0417\u0418\u0426\u0418\u041e\u041d\u0418\u0420\u041e\u0412\u0410\u041d\u0418\u0415 \u0412 \u0424\u0410\u0419\u041b\u0415\n### 16. \u0423\u0437\u043d\u0430\u0442\u044c \u0442\u0435\u043a\u0443\u0449\u0443\u044e \u043f\u043e\u0437\u0438\u0446\u0438\u044e\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    std::cout << \"\u041f\u043e\u0437\u0438\u0446\u0438\u044f: \" << f.tellg();\n    f.close();\n}\n```\n\n### 17. \u041f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442\u044c\u0441\u044f \u0432 \u043d\u0430\u0447\u0430\u043b\u043e \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    f.seekg(0, std::ios::beg);\n    std::cout << \"\u041c\u044b \u0432 \u043d\u0430\u0447\u0430\u043b\u0435!\";\n    f.close();\n}\n```\n\n### 18. \u041f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442\u044c\u0441\u044f \u043d\u0430 10 \u0431\u0430\u0439\u0442 \u043e\u0442 \u043d\u0430\u0447\u0430\u043b\u0430\n\n```cpp\n#include <fstream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    f.seekg(10);\n    // \u0447\u0442\u0435\u043d\u0438\u0435 \u043d\u0430\u0447\u043d\u0451\u0442\u0441\u044f \u0441 10-\u0433\u043e \u0431\u0430\u0439\u0442\u0430\n    f.close();\n}\n```\n\n### 19. \u041f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442\u044c\u0441\u044f \u0432 \u043a\u043e\u043d\u0435\u0446 \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    f.seekg(0, std::ios::end);\n    std::cout << \"\u0420\u0430\u0437\u043c\u0435\u0440 \u0444\u0430\u0439\u043b\u0430: \" << f.tellg() << \" \u0431\u0430\u0439\u0442\";\n    f.close();\n}\n```\n\n### 20. \u041f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442\u044c\u0441\u044f \u043d\u0430 -5 \u0431\u0430\u0439\u0442 \u043e\u0442 \u043a\u043e\u043d\u0446\u0430\n\n```cpp\n#include <fstream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    f.seekg(-5, std::ios::end);\n    // \u0447\u0442\u0435\u043d\u0438\u0435 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u0445 5 \u0431\u0430\u0439\u0442\n    f.close();\n}\n```\n\n## \u041e\u0411\u0420\u0410\u0411\u041e\u0422\u041a\u0410 \u041e\u0428\u0418\u0411\u041e\u041a \u0418 \u0421\u041e\u0421\u0422\u041e\u042f\u041d\u0418\u042f\n### 21. \u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043d\u0430 \u043a\u043e\u043d\u0435\u0446 \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    char ch;\n    while (!f.eof()) {\n        f.get(ch);\n        if (!f.eof()) std::cout << ch;\n    }\n    f.close();\n}\n```\n\n### 22. \u041e\u0447\u0438\u0441\u0442\u043a\u0430 \u0444\u043b\u0430\u0433\u043e\u0432 \u043e\u0448\u0438\u0431\u043e\u043a\n\n```cpp\n#include <fstream>\nint main() {\n    std::ifstream f(\"test.txt\");\n    // ... \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u0438 ...\n    f.clear();  // \u0441\u0431\u0440\u043e\u0441 \u0444\u043b\u0430\u0433\u043e\u0432 \u043e\u0448\u0438\u0431\u043e\u043a\n    f.close();\n}\n```\n\n### 23. \u041e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u043e\u0448\u0438\u0431\u043a\u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u044f\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::fstream f;\n    f.open(\"file.txt\");\n    if (f.fail()) std::cout << \"\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u043e\u0442\u043a\u0440\u044b\u0442\u044c!\";\n    f.close();\n}\n```\n\n### 24. \u0418\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u0435 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0439\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f;\n    f.exceptions(std::ifstream::failbit);\n    try {\n        f.open(\"nofile.txt\");\n    } catch (std::ifstream::failure& e) {\n        std::cout << \"\u0418\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435: \" << e.what();\n    }\n}\n```\n\n## \u0420\u0410\u0411\u041e\u0422\u0410 \u0421 FSTREAM (\u0427\u0422\u0415\u041d\u0418\u0415 + \u0417\u0410\u041f\u0418\u0421\u042c)\n### 25. \u041e\u0442\u043a\u0440\u044b\u0442\u0438\u0435 \u0444\u0430\u0439\u043b\u0430 \u0434\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f \u0438 \u0437\u0430\u043f\u0438\u0441\u0438\n\n```cpp\n#include <fstream>\nint main() {\n    std::fstream f(\"data.txt\", std::ios::in | std::ios::out);\n    f << \"\u0417\u0430\u043f\u0438\u0441\u044c\";\n    f.seekg(0);\n    // \u043c\u043e\u0436\u043d\u043e \u0447\u0438\u0442\u0430\u0442\u044c\n    f.close();\n}\n```\n\n### 26. \u0423\u0441\u0435\u0447\u0435\u043d\u0438\u0435 \u0444\u0430\u0439\u043b\u0430 \u043f\u0440\u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u0438\u0438\n\n```cpp\n#include <fstream>\nint main() {\n    std::ofstream f(\"data.txt\", std::ios::trunc);\n    // \u0441\u0442\u0430\u0440\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435 \u0431\u0443\u0434\u0443\u0442 \u0443\u0434\u0430\u043b\u0435\u043d\u044b\n    f << \"\u041d\u043e\u0432\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435\";\n    f.close();\n}\n```\n\n## \u0423\u0414\u0410\u041b\u0415\u041d\u0418\u0415 \u0418 \u041f\u0415\u0420\u0415\u0418\u041c\u0415\u041d\u041e\u0412\u0410\u041d\u0418\u0415\n### 27. \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u0444\u0430\u0439\u043b\u0430 (C++17)\n\n```cpp\n#include <filesystem>\n#include <iostream>\nint main() {\n    if (std::filesystem::remove(\"old.txt\"))\n        std::cout << \"\u0424\u0430\u0439\u043b \u0443\u0434\u0430\u043b\u0451\u043d\";\n    else std::cout << \"\u041e\u0448\u0438\u0431\u043a\u0430 \u0443\u0434\u0430\u043b\u0435\u043d\u0438\u044f\";\n}\n```\n\n### 28. \u041f\u0435\u0440\u0435\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435 \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <cstdio>\nint main() {\n    rename(\"old.txt\", \"new.txt\");\n}\n```\n\n## \u041f\u0420\u0410\u041a\u0422\u0418\u0427\u0415\u0421\u041a\u0418\u0415 \u041f\u0420\u0418\u041c\u0415\u0420\u042b\n### 29. \u041a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u043e\u0433\u043e \u0444\u0430\u0439\u043b\u0430\n\n```cpp\n#include <fstream>\nint main() {\n    std::ifstream src(\"source.txt\");\n    std::ofstream dst(\"dest.txt\");\n    dst << src.rdbuf();\n    src.close(); dst.close();\n}\n```\n\n### 30. \u041f\u043e\u0434\u0441\u0447\u0451\u0442 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 \u0432 \u0444\u0430\u0439\u043b\u0435\n\n```cpp\n#include <fstream>\n#include <iostream>\nint main() {\n    std::ifstream f(\"test.txt\", std::ios::ate);\n    std::cout << \"\u0421\u0438\u043c\u0432\u043e\u043b\u043e\u0432: \" << f.tellg();\n    f.close();\n}\n```\n\n\u042d\u0442\u043e \u043e\u0441\u043d\u043e\u0432\u043d\u044b\u0435 \u043f\u0440\u0438\u0451\u043c\u044b \u0440\u0430\u0431\u043e\u0442\u044b \u0441 \u0444\u0430\u0439\u043b\u0430\u043c\u0438 \u0432 C++. \u0414\u043b\u044f \u043a\u043e\u043c\u043f\u0438\u043b\u044f\u0446\u0438\u0438 \u043f\u0440\u0438\u043c\u0435\u0440\u043e\u0432 \u0441 `<filesystem>` \u043d\u0443\u0436\u0435\u043d C++17 (`-std=c++17`)";

\u0441 \u043d\u0430\u0447\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f\u043c\u0438\n    vector<vector<int>> vec(4, vector<int>(4));\n    int counter = 1;\n    for (int i = 0; i < 4; i++) {\n        for (int j = 0; j < 4; j++) {\n            vec[i][j] = counter++;\n        }\n    }\n    \n    cout << \"=== \u0418\u0421\u0425\u041e\u0414\u041d\u0410\u042f \u041c\u0410\u0422\u0420\u0418\u0426\u0410 4x4 ===\" << endl;\n    for (int i = 0; i < 4; i++) {\n        for (int j = 0; j < 4; j++) {\n            cout << setw(4) << vec[i][j];\n        }\n        cout << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0432\u0441\u0435\u0445 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432 \u0446\u0438\u043a\u043b\u043e\u043c for (\u0443\u043c\u043d\u043e\u0436\u0430\u0435\u043c \u043d\u0430 10)\n    for (int i = 0; i < 4; i++) {\n        for (int j = 0; j < 4; j++) {\n            vec[i][j] = vec[i][j] * 10;\n        }\n    }\n    \n    cout << \"\\n=== \u041f\u041e\u0421\u041b\u0415 \u0423\u041c\u041d\u041e\u0416\u0415\u041d\u0418\u042f \u0412\u0421\u0415\u0425 \u042d\u041b\u0415\u041c\u0415\u041d\u0422\u041e\u0412 \u041d\u0410 10 ===\" << endl;\n    for (int i = 0; i < 4; i++) {\n        for (int j = 0; j < 4; j++) {\n            cout << setw(4) << vec[i][j];\n        }\n        cout << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432 \u043f\u043e \u0443\u0441\u043b\u043e\u0432\u0438\u044e (\u0447\u0451\u0442\u043d\u044b\u0435 \u043e\u0431\u043d\u0443\u043b\u044f\u0435\u043c)\n    for (int i = 0; i < 4; i++) {\n        for (int j = 0; j < 4; j++) {\n            if (vec[i][j] % 20 == 0) {\n                vec[i][j] = 0;\n            }\n        }\n    }\n    \n    cout << \"\\n=== \u041f\u041e\u0421\u041b\u0415 \u041e\u0411\u041d\u0423\u041b\u0415\u041d\u0418\u042f \u0427\u0401\u0422\u041d\u042b\u0425 (\u043a back(0);\n    }\n    int val = 26;\n    for (int j = 0; j < 6; j++) dq[5][j] = val++;\n    for (int i = 0; i < 5; i++) dq[i][5] = val++;\n    \n    cout << \"\\n=== DEQUE 6x6 ===\" << endl;\n    for (const auto& row : dq) {\n        for (int v : row) cout << setw(4) << v;\n        cout << endl;\n    }\n    \n    // \u0423\u043c\u0435\u043d\u044c\u0448\u0435\u043d\u0438\u0435 \u0434\u043e 4x4\n    dq.pop_back(); dq.pop_back();\n    for (int i = 0; i < 4; i++) {\n        dq[i].pop_back(); dq[i].pop_back();\n    }\n    \n    cout << \"\\n=== DEQUE 4x4 ===\" << endl;\n    for (const auto& row : dq) {\n        for (int v : row) cout << setw(4) << v;\n        cout << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439\n    for (int i = 0; i < 4; i++) {\n        for (int j = 0; j < 4; j++) {\n            dq[i][j] = dq[i][j] * 10;\n        }\n    }\n    \n    cout << \"\\n=== DEQUE 4x4 (x10) ===\" << endl;\n    for (const auto& row : dq) {\n        for (int v : row) cout << setw(4) << v;\n        cout << endl;\n    }\n    \n    return 0;\n}\n```\n\n### 9. \u0422\u043e \u0436\u0435 \u0441\u0430\u043c\u043e\u0435 \u0441 std::list\n```cpp\n#include <iostream>\n#include <list>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    // \u0421\u043e\u0437\u0434\u0430\u043d\u0438\u0435 5x5 list\n    list<list<int>> lst;\n    int counter = 1;\n    for (int i = 0; i < 5; i++) {\n        list<int> row;\n        for (int j = 0; j < 5; j++) {\n            row.push_back(counter++);\n        }\n        lst.push_back(row);\n    }\n    \n    cout << \"=== LIST 5x5 ===\" << endl;\n    for (const auto& row : lst) {\n        for (int val : row) {\n            cout << setw(4) << val;\n        }\n        cout << endl;\n    }\n    \n    // \u0423\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u0438\u0435 \u0434\u043e 6x6\n    list<int> newRow(6, 0);\n    lst.push_back(newRow);\n    int val = 26;\n    auto lastRow = lst.end(); --lastRow;\n    for (auto& cell : *lastRow) cell = val++;\n    for (auto it = lst.begin(); it != lastRow; ++it) {\n        it->push_back(val++);\n    }\n    (*lastRow).push_back(val);\n    // \u041a\u043e\u0440\u0440\u0435\u043a\u0442\u0438\u0440\u043e\u0432\u043a\u0430: \u0437\u0430\u043f\u043e\u043b\u043d\u0438\u043c \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e\n    val = 26;\n    for (auto& cell : *lastRow) cell = val++;\n    val = 32;\n    for (auto it = lst.begin(); it != lastRow; ++it) {\n        it->push_back(val++);\n    }\n    \n    cout << \"\\n=== LIST 6x6 ===\" << endl;\n    for (const auto& row : lst) {\n        for (int v : row) cout << setw(4) << v;\n        cout << endl;\n    }\n    \n    // \u0423\u043c\u0435\u043d\u044c\u0448\u0435\u043d\u0438\u0435 \u0434\u043e 4x4\n    lst.pop_back(); lst.pop_back();\n    for (auto& row : lst) {\n        row.pop_back(); row.pop_back();\n    }\n    \n    cout << \"\\n=== LIST 4x4 ===\" << endl;\n    for (const auto& row : lst) {\n        for (int v : row) cout << setw(4) << v;\n        cout << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439\n    for (auto& row : lst) {\n        for (auto& cell : row) {\n            cell = cell * 10;\n        }\n    }\n    \n    cout << \"\\n=== LIST 4x4 (x10) ===\" << endl;\n    for (const auto& row : lst) {\n        for (int v : row) cout << setw(4) << v;\n        cout << endl;\n    }\n    \n    return 0;\n}\n```\n\n### 10. \u041f\u0440\u043e\u0441\u0442\u043e\u0439 \u0441\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 2D \u043c\u0430\u0441\u0441\u0438\u0432\n```cpp\n#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    // \u041f\u0440\u043e\u0441\u0442\u043e\u0439 \u0441\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 5x5\n    int arr[5][5];\n    \n    // \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435\n    int counter = 1;\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            arr[i][j] = counter++;\n        }\n    }\n    \n    cout << \"=== \u041f\u0420\u041e\u0421\u0422\u041e\u0419 \u041c\u0410\u0421\u0421\u0418\u0412 5x5 ===\" << endl;\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            cout << setw(4) << arr[i][j];\n        }\n        cout << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439 \u0446\u0438\u043a\u043b\u043e\u043c for\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            arr[i][j] = arr[i][j] * 10;\n        }\n    }\n    \n    cout << \"\\n=== \u041c\u0410\u0421\u0421\u0418\u0412 5x5 (x10) ===\" << endl;\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            cout << setw(4) << arr[i][j];\n        }\n        cout << endl;\n    }\n    \n    cout << \"\\n\u041f\u0420\u0418\u041c\u0415\u0427\u0410\u041d\u0418\u0415: \u0421\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 \u043d\u0435\u043b\u044c\u0437\u044f \u0443\u0432\u0435\u043b\u0438\u0447\u0438\u0442\u044c/\u0443\u043c\u0435\u043d\u044c\u0448\u0438\u0442\u044c!\" << endl;\n    cout << \"\u0420\u0430\u0437\u043c\u0435\u0440 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d \u043d\u0430 \u044d\u0442\u0430\u043f\u0435 \u043a\u043e\u043c\u043f\u0438\u043b\u044f\u0446\u0438\u0438: 5x5\" << endl;\n    \n    return 0;\n}\n```\n\n### 11. \u0414\u0438\u043d\u0430\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u0439 2D \u043c\u0430\u0441\u0441\u0438\u0432 (\u0441 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435\u043c \u0440\u0430\u0437\u043c\u0435\u0440\u0430 \u0432\u0440\u0443\u0447\u043d\u0443\u044e)\n```cpp\n#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    int rows = 5, cols = 5;\n    \n    // \u0412\u044b\u0434\u0435\u043b\u0435\u043d\u0438\u0435 \u043f\u0430\u043c\u044f\u0442\u0438 \u043f\u043e\u0434 \u0434\u0438\u043d\u0430\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 5x5\n    int** arr = new int*[rows];\n    for (int i = 0; i < rows; i++) {\n        arr[i] = new int[cols];\n    }\n    \n    // \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435\n    int counter = 1;\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            arr[i][j] = counter++;\n        }\n    }\n    \n    cout << \"=== \u0414\u0418\u041d\u0410\u041c\u0418\u0427\u0415\u0421\u041a\u0418\u0419 \u041c\u0410\u0421\u0421\u0418\u0412 5x5 ===\" << endl;\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            cout << setw(4) << arr[i][j];\n        }\n        cout << endl;\n    }\n    \n    // \"\u0423\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u0438\u0435\" \u0434\u043e 6x6 (\u0441\u043e\u0437\u0434\u0430\u0451\u043c \u043d\u043e\u0432\u044b\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 \u0438 \u043a\u043e\u043f\u0438\u0440\u0443\u0435\u043c)\n    int newRows = 6, newCols = 6;\n    int** newArr = new int*[newRows];\n    for (int i = 0; i < newRows; i++) {\n        newArr[i] = new int[newCols];\n    }\n    \n    // \u041a\u043e\u043f\u0438\u0440\u0443\u0435\u043c \u0441\u0442\u0430\u0440\u044b\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            newArr[i][j] = arr[i][j];\n        }\n    }\n    // \u0417\u0430\u043f\u043e\u043b\u043d\u044f\u0435\u043c \u043d\u043e\u0432\u044b\u0435 \u044f\u0447\u0435\u0439\u043a\u0438\n    int val = 26;\n    for (int j = 0; j < newCols; j++) newArr[5][j] = val++;\n    for (int i = 0; i < rows; i++) newArr[i][5] = val++;\n    \n    // \u0423\u0434\u0430\u043b\u044f\u0435\u043c \u0441\u0442\u0430\u0440\u044b\u0439 \u043c\u0430\u0441\u0441\u0438\u0432\n    for (int i = 0; i < rows; i++) delete[] arr[i];\n    delete[] arr;\n    \n    arr = newArr;\n    rows = newRows;\n    cols = newCols;\n    \n    cout << \"\\n=== \u0414\u0418\u041d\u0410\u041c\u0418\u0427\u0415\u0421\u041a\u0418\u0419 \u041c\u0410\u0421\u0421\u0418\u0412 6x6 ===\" << endl;\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            cout << setw(4) << arr[i][j];\n        }\n        cout << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            arr[i][j] = arr[i][j] * 10;\n        }\n    }\n    \n    cout << \"\\n=== \u0414\u0418\u041d\u0410\u041c\u0418\u0427\u0415\u0421\u041a\u0418\u0419 \u041c\u0410\u0421\u0421\u0418\u0412 6x6 (x10) ===\" << endl;\n    for (int i = 0; i < rows; i++) {\n        for (int j = 0; j < cols; j++) {\n            cout << setw(4) << arr[i][j];\n        }\n        cout << endl;\n    }\n    \n    // \u041e\u0441\u0432\u043e\u0431\u043e\u0436\u0434\u0435\u043d\u0438\u0435 \u043f\u0430\u043c\u044f\u0442\u0438\n    for (int i = 0; i < rows; i++) delete[] arr[i];\n    delete[] arr;\n    \n    return 0;\n}\n```\n\n### 12. \u0414\u0435\u043c\u043e\u043d\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0432\u0441\u0435\u0445 \u043c\u0435\u0442\u043e\u0434\u043e\u0432 \u0432\u0435\u043a\u0442\u043e\u0440\u0430 (capacity, resize, reserve \u0438 \u0442.\u0434.)\n```cpp\n#include <iostream>\n#include <vector>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    vector<vector<int>> vec;\n    \n    cout << \"=== \u0414\u0415\u041c\u041e\u041d\u0421\u0422\u0420\u0410\u0426\u0418\u042f \u041c\u0415\u0422\u041e\u0414\u041e\u0412 VECTOR ===\" << endl;\n    \n    // reserve\n    vec.reserve(5);\n    cout << \"\u041f\u043e\u0441\u043b\u0435 reserve(5): size=\" << vec.size() \n         << \", capacity=\" << vec.capacity() << endl;\n    \n    // resize\n    vec.resize(5, vector<int>(5, 0));\n    cout << \"\u041f\u043e\u0441\u043b\u0435 resize(5, vector<int>(5,0)): size=\" << vec.size() \n         << \", capacity=\" << vec.capacity() << endl;\n    \n    // \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435\n    int counter = 1;\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            vec[i][j] = counter++;\n        }\n    }\n    \n    cout << \"\\n\u0421\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435 5x5:\" << endl;\n    for (const auto& row : vec) {\n        for (int val : row) cout << setw(4) << val;\n        cout << endl;\n    }\n    \n    // at()\n    cout << \"\\nvec.at(2).at(2) = \" << vec.at(2).at(2) << endl;\n    \n    // front() \u0438 back()\n    cout << \"vec.front()[0] = \" << vec.front()[0] << endl;\n    cout << \"vec.back()[4] = \" << vec.back()[4] << endl;\n    \n    // data()\n    cout << \"vec.data() = \" << vec.data() << endl;\n    \n    // empty()\n    cout << \"vec.empty() = \" << (vec.empty() ? \"true\" : \"false\") << endl;\n    \n    // max_size()\n    cout << \"vec.max_size() = \" << vec.max_size() << endl;\n    \n    // clear\n    vec.clear();\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 clear(): size=\" << vec.size() \n         << \", capacity=\" << vec.capacity() \n         << \", empty=\" << (vec.empty() ? \"true\" : \"false\") << endl;\n    \n    // shrink_to_fit\n    vec.shrink_to_fit();\n    cout << \"\u041f\u043e\u0441\u043b\u0435 shrink_to_fit(): capacity=\" << vec.capacity() << endl;\n    \n    return 0;\n}\n```\n\n\u0412\u0441\u0435 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u044b \u0433\u043e\u0442\u043e\u0432\u044b \u043a \u043a\u043e\u043c\u043f\u0438\u043b\u044f\u0446\u0438\u0438 \u0438 \u0437\u0430\u043f\u0443\u0441\u043a\u0443. \u041a\u0430\u0436\u0434\u0430\u044f \u0434\u0435\u043c\u043e\u043d\u0441\u0442\u0440\u0438\u0440\u0443\u0435\u0442 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435 \u0441 \u0432\u0435\u043a\u0442\u043e\u0440\u043e\u043c \u0438\u043b\u0438 \u0434\u0440\u0443\u0433\u0438\u043c \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u043e\u043c.\n\n# \u0432\u044b\u0432\u0435\u0434\u0438 \u0441\u043f\u0438\u0441\u043e\u043a \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u043e\u0432 \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u044b\n\u0412\u043e\u0442 \u0441\u043f\u0438\u0441\u043e\u043a \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u043e\u0432, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0431\u044b\u043b\u0438 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u044b \u0432 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u0430\u0445:\n\n# \u0420\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043d\u044b\u0435 \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u044b\n| \u2116 | \u041a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440 | \u0417\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u0447\u043d\u044b\u0439 \u0444\u0430\u0439\u043b | \u041e\u043f\u0438\u0441\u0430\u043d\u0438\u0435 |\n|---|---|---|---|\n| 1 | std::vector | <vector> | \u0414\u0438\u043d\u0430\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 \u0441 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u044b\u043c \u0434\u043e\u0441\u0442\u0443\u043f\u043e\u043c. \u042d\u043b\u0435\u043c\u0435\u043d\u0442\u044b \u0445\u0440\u0430\u043d\u044f\u0442\u0441\u044f \u0432 \u043d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u043e\u0439 \u043e\u0431\u043b\u0430\u0441\u0442\u0438 \u043f\u0430\u043c\u044f\u0442\u043 705 \u0434\u043e 6x6 (\u0440\u0443\u0447\u043d\u043e\u0435) | \u274c \u043d\u0435 \u043f\u043e\u043a\u0430\u0437\u0430\u043d\u043e | \u2705 (x10) | \u274c (\u0442\u043e\u043b\u044c\u043a\u043e new/delete) |\n# \u041a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u044b, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u041d\u0415 \u0431\u044b\u043b\u0438 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u044b\n\u0418\u0437 \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u043e\u0439 \u0431\u0438\u0431\u043b\u0438\u043e\u0442\u0435\u043a\u0438 C++ \u043e\u0441\u0442\u0430\u043b\u0438\u0441\u044c \u043d\u0435\u0437\u0430\u0442\u0440\u043e\u043d\u0443\u0442\u044b\u043c\u0438:\n\n| \u041a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440 | \u0417\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u0447\u043d\u044b\u0439 \u0444\u0430\u0439\u043b | \u0422\u0438\u043f |\n|---|---|---|\n| std::array | <array> | \u0421\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432-\u043e\u0431\u0451\u0440\u0442\u043a\u0430 (\u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0440\u0430\u0437\u043c\u0435\u0440) |\n| std::forward_list | <forward_list> | \u041e\u0434\u043d\u043e\u0441\u0432\u044f\u0437\u043d\u044b\u0439 \u0441\u043f\u0438\u0441\u043e\u043a |\n| std::set | <set> | \u041c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u043e (\u0443\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435 \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b) |\n| std::multiset | <set> | \u041c\u0443\u043b\u044c\u0442\u0438\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u043e (\u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b) |\n| std::map | <map> | \u0410\u0441\u0441\u043e\u0446\u0438\u0430\u0442\u0438\u0432\u043d\u044b\u0439 \u043c\u0430\u0441\u0441\u0438\u0432 (\u0441\u043b\u043e\u0432\u0430\u0440\u044c) |\n| std::multimap | <map> | \u041c\u0443\u043b\u044c\u0442\u0438\u0441\u043b\u043e\u0432\u0430\u0440\u044c (\u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u043a\u043b\u044e\u0447\u0435\u0439) |\n| std::unordered_set | <unordered_set> | \u0425\u0435\u0448-\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u043e |\n| std::unordered_multiset | <unordered_set> | \u0425\u0435\u0448-\u043c\u0443\u043b\u044c\u0442\u0438\u043c\u043d\u043e\u0436\u0435\u0441\u0442\u0432\u043e |\n| std::unordered_map | <unordered_map> | \u0425\u0435\u0448-\u0442\u0430\u0431\u043b\u0438\u0446\u0430 (\u0441\u043b\u043e\u0432\u0430\u0440\u044c) |\n| std::unordered_multimap | <unordered_map> | \u0425\u0435\u0448-\u043c\u0443\u043b\u044c\u0442\u0438\u0441\u043b\u043e\u0432\u0430\u0440\u044c |\n| std::stack | <stack> | \u0410\u0434\u0430\u043f\u0442\u0435\u0440 \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u0430 (\u0441\u0442\u0435\u043a LIFO) |\n| std::queue | <queue> | \u0410\u0434\u0430\u043f\u0442\u0435\u0440 \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u0430 (\u043e\u0447\u0435\u0440\u0435\u0434\u044c FIFO) |\n| std::priority_queue | <queue> | \u0410\u0434\u0430\u043f\u0442\u0435\u0440 \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u0430 (\u043e\u0447\u0435\u0440\u0435\u0434\u044c \u0441 \u043f\u0440\u0438\u043e\u0440\u0438\u0442\u0435\u0442\u043e\u043c) |\n| std::span | <span> (C++20) | \u041f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043d\u0435\u043f\u0440\u0435\u0440\u044b\u0432\u043d\u043e\u0439 \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438 |\n\u0418\u0442\u043e\u0433\u043e: \u0438\u0437 16+ \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0445 \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u043e\u0432/\u0430\u0434\u0430\u043f\u0442\u0435\u0440\u043e\u0432 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043e 5 (vector, deque, list, \u0441\u0442\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432, \u0434\u0438\u043d\u0430\u043c\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0430\u0441\u0441\u0438\u0432). \u041e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u0430\u043a\u0446\u0435\u043d\u0442 \u0441\u0434\u0435\u043b\u0430\u043d \u043d\u0430 std::vector \u043a\u0430\u043a \u043d\u0430 \u0441\u0430\u043c\u043e\u043c \u0443\u043d\u0438\u0432\u0435\u0440\u0441\u0430\u043b\u044c\u043d\u043e\u043c \u0438 \u0447\u0430\u0441\u0442\u043e \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u043c\u043e\u043c \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u0435.\n\n\u0436\u0434\u0443 \u043f\u043e  \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u043c\n\u0412\u043e\u0442 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u044b \u0434\u043b\u044f \u0432\u0441\u0435\u0445 \u043e\u0441\u0442\u0430\u0432\u0448\u0438\u0445\u0441\u044f \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u043e\u0432. \u041a\u0430\u0436\u0434\u0430\u044f \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u0430 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u0430\u044f \u0438 \u0441\u0430\u043c\u043e\u0434\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u0430\u044f.\n\n### 1. std::array\n```cpp\n#include <iostream>\n#include <array>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    // \u0421\u043e\u0437\u0434\u0430\u043d\u0438\u0435 5x5 \u0447\u0435\u0440\u0435\u0437 array (\u0440\u0430\u0437\u043c\u0435\u0440 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d!)\n    array<array<int, 5>, 5> arr;\n    \n    // \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435\n    int counter = 1;\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            arr[i][j] = counter++;\n        }\n    }\n    \n    cout << \"=== std::array 5x5 ===\" << endl;\n    cout << \"\u0420\u0430\u0437\u043c\u0435\u0440: \" << arr.size() << \"x\" << arr[0].size() << endl;\n    for (const auto& row : arr) {\n        for (int val : row) {\n            cout << setw(4) << val;\n        }\n        cout << endl;\n    }\n    \n    // \u041c\u0435\u0442\u043e\u0434\u044b\n    cout << \"\\n\u041c\u0435\u0442\u043e\u0434\u044b array:\" << endl;\n    cout << \"size(): \" << arr.size() << endl;\n    cout << \"max_size(): \" << arr.max_size() << endl;\n    cout << \"empty(): \" << (arr.empty() ? \"true\" : \"false\") << endl;\n    cout << \"front()[0][0]: \" << arr.front()[0] << endl;\n    cout << \"back()[4][4]: \" << arr.back()[4] << endl;\n    cout << \"at(2).at(2): \" << arr.at(2).at(2) << endl;\n    cout << \"data(): \" << arr.data() << endl;\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439 \u0446\u0438\u043a\u043b\u043e\u043c for\n    for (int i = 0; i < 5; i++) {\n        for (int j = 0; j < 5; j++) {\n            arr[i][j] = arr[i][j] * 10;\n        }\n    }\n    \n    cout << \"\\n=== \u041f\u041e\u0421\u041b\u0415 \u0423\u041c\u041d\u041e\u0416\u0415\u041d\u0418\u042f \u041d\u0410 10 ===\" << endl;\n    for (const auto& row : arr) {\n        for (int val : row) {\n            cout << setw(4) << val;\n        }\n        cout << endl;\n    }\n    \n    // \u0417\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 fill\n    arr[0].fill(999);\n    cout << \"\\n=== \u041f\u043e\u0441\u043b\u0435 fill(999) \u043f\u0435\u0440\u0432\u043e\u0439 \u0441\u0442\u0440\u043e\u043a\u0438 ===\" << endl;\n    for (const auto& row : arr) {\n        for (int val : row) {\n            cout << setw(4) << val;\n        }\n        cout << endl;\n    }\n    \n    // swap \u0434\u0432\u0443\u0445 \u0441\u0442\u0440\u043e\u043a\n    arr[0].swap(arr[4]);\n    cout << \"\\n=== \u041f\u043e\u0441\u043b\u0435 swap \u0441\u0442\u0440\u043e\u043a 0 \u0438 4 ===\" << endl;\n    for (const auto& row : arr) {\n        for (int val : row) {\n            cout << setw(4) << val;\n        }\n        cout << endl;\n    }\n    \n    // \u0418\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u044b\n    cout << \"\\n\u0418\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u044b (\u043f\u0435\u0440\u0432\u0430\u044f \u0441\u0442\u0440\u043e\u043a\u0430):\" << endl;\n    for (auto it = arr[0].begin(); it != arr[0].end(); ++it) {\n        cout << *it << \" \";\n    }\n    cout << endl;\n    \n    // \u041e\u0431\u0440\u0430\u0442\u043d\u044b\u0435 \u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u044b\n    cout << \"\u041e\u0431\u0440\u0430\u0442\u043d\u044b\u0435 \u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u044b (\u043f\u043e\u0441\u043b\u0435\u0434\u043d\u044f\u044f \u0441\u0442\u0440\u043e\u043a\u0430):\" << endl;\n    for (auto it = arr[4].rbegin(); it != arr[4].rend(); ++it) {\n        cout << *it << \" \";\n    }\n    cout << endl;\n    \n    cout << \"\\n\u041f\u0420\u0418\u041c\u0415\u0427\u0410\u041d\u0418\u0415: std::array \u0438\u043c\u0435\u0435\u0442 \u0424\u0418\u041a\u0421\u0418\u0420\u041e\u0412\u0410\u041d\u041d\u042b\u0419 \u0440\u0430\u0437\u043c\u0435\u0440!\" << endl;\n    cout << \"\u041d\u0435\u043b\u044c\u0437\u044f \u0438\u0437\u043c\u0435\u043d\u0438\u0442\u044c 5x5 -> 6x6 \u0438\u043b\u0438 4x4.\" << endl;\n    \n    return 0;\n}\n```\n\n### 2. std::forward_list\n```cpp\n#include <iostream>\n#include <forward_list>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    // \u0421\u043e\u0437\u0434\u0430\u043d\u0438\u0435 \u043e\u0434\u043d\u043e\u0441\u0432\u044f\u0437\u043d\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0430 (\u0442\u043e\u043b\u044c\u043a\u043e \u0432\u043f\u0435\u0440\u0451\u0434!)\n    forward_list<int> flist;\n    \n    cout << \"=== std::forward_list (\u041e\u0414\u041d\u041e\u0421\u0412\u042f\u0417\u041d\u042b\u0419 \u0421\u041f\u0418\u0421\u041e\u041a) ===\" << endl;\n    \n    // \u0414\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432 \u0432 \u043d\u0430\u0447\u0430\u043b\u043e\n    for (int i = 5; i >= 1; i--) {\n        flist.push_front(i * 10);\n    }\n    \n    cout << \"\u041f\u043e\u0441\u043b\u0435 push_front (5 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432):\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // \u041c\u0435\u0442\u043e\u0434\u044b\n    cout << \"\\n\u041c\u0435\u0442\u043e\u0434\u044b forward_list:\" << endl;\n    cout << \"empty(): \" << (flist.empty() ? \"true\" : \"false\") << endl;\n    cout << \"front(): \" << flist.front() << endl;\n    // max_size(), resize(), reverse(), sort(), merge(), unique(), remove(), remove_if()\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430 \u043f\u043e\u0441\u043b\u0435 \u043f\u0435\u0440\u0432\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\n    auto it = flist.begin();\n    flist.insert_after(it, 999);\n    \n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 insert_after(\u043f\u0435\u0440\u0432\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430, 999):\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // emplace_after\n    it = flist.begin();\n    flist.emplace_after(it, 777);\n    \n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 emplace_after(\u043f\u0435\u0440\u0432\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430, 777):\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043f\u043e\u0441\u043b\u0435 \u043f\u0435\u0440\u0432\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430\n    it = flist.begin();\n    flist.erase_after(it);\n    \n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase_after(\u043f\u0435\u0440\u0432\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430):\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439\n    for (int& val : flist) {\n        val = val * 2;\n    }\n    \n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 \u0443\u043c\u043d\u043e\u0436\u0435\u043d\u0438\u044f \u0432\u0441\u0435\u0445 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432 \u043d\u0430 2:\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // sort\n    flist.sort();\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 sort():\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // reverse\n    flist.reverse();\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 reverse():\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // unique (\u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u043f\u043e\u0434\u0440\u044f\u0434)\n    flist.push_front(20);\n    flist.push_front(20);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u043e\u0432 20,20 \u0432 \u043d\u0430\u0447\u0430\u043b\u043e:\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    flist.unique();\n    cout << \"\u041f\u043e\u0441\u043b\u0435 unique():\" << endl;\n    for (int val : flist) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // remove\n    flist.remove(40);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 remove(40):\" << endl;\n    for (int val : flist) {\n        cout << s \"\\n\u0425\u0410\u0420\u0410\u041a\u0422\u0415\u0420\u0418\u0421\u0422\u0418\u041a\u0418 set:\" << endl;\n    cout << \"- \u0425\u0440\u0430\u043d\u0438\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0443\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b\" << endl;\n    cout << \"- \u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0441\u043e\u0440\u0442\u0438\u0440\u0443\u0435\u0442 (\u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e \u043f\u043e \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u0430\u043d\u0438\u044e)\" << endl;\n    cout << \"- \u041f\u043e\u0438\u0441\u043a, \u0432\u0441\u0442\u0430\u0432\u043a\u0430, \u0443\u0434\u0430\u043b\u0435\u043d\u0438\u0435: O(log n)\" << endl;\n    cout << \"- \u041d\u0435\u043b\u044c\u0437\u044f \u0438\u0437\u043c\u0435\u043d\u0438\u0442\u044c \u044d\u043b\u0435\u043c\u0435\u043d\u0442 (\u0442\u043e\u043b\u044c\u043a\u043e \u0443\u0434\u0430\u043b\u0438\u0442\u044c \u0438 \u0432\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043d\u043e\u0432\u044b\u0439)\" << endl;\n    \n    return 0;\n}\n```\n\n### 4. std::multiset\n```cpp\n#include <iostream>\n#include <set>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    multiset<int> ms;\n    \n    cout << \"=== std::multiset (\u041c\u0423\u041b\u042c\u0422\u0418\u041c\u041d\u041e\u0416\u0415\u0421\u0422\u0412\u041e - \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u044b) ===\" << endl;\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430 (\u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u044e\u0442\u0441\u044f!)\n    ms.insert(30);\n    ms.insert(10);\n    ms.insert(50);\n    ms.insert(30);  // \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442 \u0421\u041e\u0425\u0420\u0410\u041d\u042f\u0415\u0422\u0421\u042f!\n    ms.insert(30);  // \u0435\u0449\u0451 \u043e\u0434\u0438\u043d\n    ms.insert(20);\n    ms.insert(50);  // \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\n    \n    cout << \"\u041f\u043e\u0441\u043b\u0435 \u0432\u0441\u0442\u0430\u0432\u043a\u0438 {30,10,50,30,30,20,50}:\" << endl;\n    for (int val : ms) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    cout << \"\u0420\u0430\u0437\u043c\u0435\u0440: \" << ms.size() << endl;\n    \n    // count (\u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c > 1)\n    cout << \"\\ncount(30): \" << ms.count(30) << \" (\u0442\u0440\u0438 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430)\" << endl;\n    cout << \"count(10): \" << ms.count(10) << \" (\u043e\u0434\u0438\u043d \u044d\u043b\u0435\u043c\u0435\u043d\u0442)\" << endl;\n    cout << \"count(100): \" << ms.count(100) << \" (\u043d\u0435\u0442 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432)\" << endl;\n    \n    // find \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u043f\u0435\u0440\u0432\u044b\u0439 \u043d\u0430\u0439\u0434\u0435\u043d\u043d\u044b\u0439\n    auto it = ms.find(30);\n    cout << \"find(30): \" << *it << endl;\n    \n    // equal_range\n    auto range = ms.equal_range(30);\n    cout << \"\\nequal_range(30):\" << endl;\n    for (auto it = range.first; it != range.second; ++it) {\n        cout << *it << \" \";\n    }\n    cout << endl;\n    \n    // lower_bound / upper_bound\n    cout << \"lower_bound(30): \" << *ms.lower_bound(30) << endl;\n    cout << \"upper_bound(30): \" << *ms.upper_bound(30) << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043f\u043e \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044e (\u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415 \u0432\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f!)\n    ms.erase(30);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase(30) - \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415 \u0442\u0440\u043e\u0439\u043a\u0438:\" << endl;\n    for (int val : ms) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043e\u0434\u043d\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430 \u043f\u043e \u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u0443\n    ms.insert(50);\n    ms.insert(50);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0435\u0449\u0451 \u0434\u0432\u0443\u0445 50:\" << endl;\n    for (int val : ms) cout << setw(4) << val;\n    cout << endl;\n    \n    it = ms.find(50);\n    if (it != ms.end()) ms.erase(it);  // \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u0438\u043d!\n    cout << \"\u041f\u043e\u0441\u043b\u0435 erase(find(50)) - \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u041e\u0414\u0418\u041d:\" << endl;\n    for (int val : ms) cout << setw(4) << val;\n    cout << endl;\n    \n    // emplace\n    ms.emplace(25);\n    ms.emplace(25);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 \u0434\u0432\u0443\u0445 emplace(25):\" << endl;\n    for (int val : ms) cout << setw(4) << val;\n    cout << endl;\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0432\u0441\u0435\u0445 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432 (\u0442\u043e\u043b\u044c\u043a\u043e \u0447\u0435\u0440\u0435\u0437 \u0443\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u0438 \u0432\u0441\u0442\u0430\u0432\u043a\u0443)\n    cout << \"\\n\u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435: multiset \u043d\u0435 \u043f\u043e\u0437\u0432\u043e\u043b\u044f\u0435\u0442 \u043c\u0435\u043d\u044f\u0442\u044c \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b \u043d\u0430 \u043c\u0435\u0441\u0442\u0435!\" << endl;\n    cout << \"\u041d\u0443\u0436\u043d\u043e: \u0441\u0442\u0435\u0440\u0435\u0442\u044c \u0441\u0442\u0430\u0440\u044b\u0439, \u0432\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043d\u043e\u0432\u044b\u0439.\" << endl;\n    \n    // \u041f\u0440\u0438\u043c\u0435\u0440: \u0437\u0430\u043c\u0435\u043d\u0438\u0442\u044c \u0432\u0441\u0435 50 \u043d\u0430 55\n    while (ms.find(50) != ms.end()) {\n        ms.erase(ms.find(50));\n        ms.insert(55);\n    }\n    cout << \"\u041f\u043e\u0441\u043b\u0435 \u0437\u0430\u043c\u0435\u043d\u044b \u0432\u0441\u0435\u0445 50 \u043d\u0430 55:\" << endl;\n    for (int val : ms) cout << setw(4) << val;\n    cout << endl;\n    \n    cout << \"\\n\u0425\u0410\u0420\u0410\u041a\u0422\u0415\u0420\u0418\u0421\u0422\u0418\u041a\u0418 multiset:\" << endl;\n    cout << \"- \u0414\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b\" << endl;\n    cout << \"- \u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0441\u043e\u0440\u0442\u0438\u0440\u0443\u0435\u0442\" << endl;\n    cout << \"- erase(\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435) \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415 \u0432\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f\" << endl;\n    cout << \"- erase(\u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440) \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u041e\u0414\u0418\u041d \u044d\u043b\u0435\u043c\u0435\u043d\u0442\" << endl;\n    \n    return 0;\n}\n```\n\n### 5. std::map\n```cpp\n#include <iostream>\n#include <map>\n#include <iomanip>\n#include <string>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    map<string, int> m;\n    \n    cout << \"=== std::map (\u0421\u041b\u041e\u0412\u0410\u0420\u042c - \u043a\u043b\u044e\u0447:\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435, \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d) ===\" << endl;\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430 \u0440\u0430\u0437\u043d\u044b\u043c\u0438 \u0441\u043f\u043e\u0441\u043e\u0431\u0430\u043c\u0438\n    m[\"\u0418\u0432\u0430\u043d\u043e\u0432\"] = 85;\n    m[\"\u041f\u0435\u0442\u0440\u043e\u0432\"] = 92;\n    m.insert({\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\", 78});\n    m.insert(pair<string, int>(\"\u041a\u043e\u0437\u043b\u043e\u0432\", 95));\n    m.emplace(\"\u0424\u0451\u0434\u043e\u0440\u043e\u0432\", 88);\n    \n    // \u041f\u043e\u043f\u044b\u0442\u043a\u0430 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u0430 \u043a\u043b\u044e\u0447\u0430\n    m[\"\u0418\u0432\u0430\u043d\u043e\u0432\"] = 90;  // \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0438\u0448\u0435\u0442 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435!\n    \n    cout << \"\u0421\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435 \u0441\u043b\u043e\u0432\u0430\u0440\u044f:\" << endl;\n    cout << setw(15) << \"\u0424\u0430\u043c\u0438\u043b\u0438\u044f\" << \" | \" << \"\u0411\u0430\u043b\u043b\" << endl;\n    cout << string(25, '-') << endl;\n    for (const auto& [key, value] : m) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // \u041c\u0435\u0442\u043e\u0434\u044b\n    cout << \"\\n\u041c\u0435\u0442\u043e\u0434\u044b map:\" << endl;\n    cout << \"size(): \" << m.size() << endl;\n    cout << \"max_size(): \" << m.max_size() << endl;\n    cout << \"empty(): \" << (m.empty() ? \"true\" : \"false\") << endl;\n    \n    // \u0414\u043e\u0441\u0442\u0443\u043f \u043f\u043e \u043a\u043b\u044e\u0447\u0443\n    cout << \"m[\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\"]: \" << m[\"\u0418\u0432\u0430\u043d\u043e\u0432\"] << endl;\n    cout << \"m.at(\\\"\u041f\u0435\u0442\u0440\u043e\u0432\\\"): \" << m.at(\"\u041f\u0435\u0442\u0440\u043e\u0432\") << endl;\n    \n    // \u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043e\u0432\u0430\u043d\u0438\u044f \u043a\u043b\u044e\u0447\u0430\n    cout << \"count(\\\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\\\"): \" << m.count(\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\") << endl;\n    cout << \"count(\\\"\u041d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0439\\\"): \" << m.count(\"\u041d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0439\") << endl;\n    \n    // find\n    auto it = m.find(\"\u041a\u043e\u0437\u043b\u043e\u0432\");\n    if (it != m.end()) {\n        cout << \"find(\\\"\u041a\u043e\u0437\u043b\u043e\u0432\\\"): \" << it->first << \" = \" << it->second << endl;\n    }\n    \n    // contains (C++20)\n    // cout << \"contains(\\\"\u0424\u0451\u0434\u043e\u0440\u043e\u0432\\\"): \" << m.contains(\"\u0424\u0451\u0434\u043e\u0440\u043e\u0432\") << endl;\n    \n    // lower_bound / upper_bound\n    it = m.lower_bound(\"\u041a\");\n    cout << \"lower_bound(\\\"\u041a\\\"): \" << it->first << \" = \" << it->second << endl;\n    it = m.upper_bound(\"\u041a\");\n    cout << \"upper_bound(\\\"\u041a\\\"): \" << it->first << \" = \" << it->second << endl;\n    \n    // insert_or_assign (C++17)\n    m.insert_or_assign(\"\u0418\u0432\u0430\u043d\u043e\u0432\", 100);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 insert_or_assign(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\", 100):\" << endl;\n    for (const auto& [key, value] : m) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // try_emplace (\u043d\u0435 \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u044e\u0449\u0438\u0439)\n    auto [iter, inserted] = m.try_emplace(\"\u041f\u0435\u0442\u0440\u043e\u0432\", 50);\n    cout << \"\\ntry_emplace(\\\"\u041f\u0435\u0442\u0440\u043e\u0432\\\", 50): \u0432\u0441\u0442\u0430\u0432\u043b\u0435\u043d=\" << (inserted ? \"\u0434\u0430\" : \"\u043d\u0435\u0442\") << endl;\n    cout << \"\u0417\u043d\u0430\u0447\u0435\u043d\u0438\u0435 \u043e\u0441\u0442\u0430\u043b\u043e\u0441\u044c: \" << iter->second << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435\n    m.erase(\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\");\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase(\\\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\\\"):\" << endl;\n    for (const auto& [key, value] : m) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439 \u0446\u0438\u043a\u043b\u043e\u043c\n    cout << \"\\n\u0423\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u0438\u0435 \u0432\u0441\u0435\u0445 \u0431\u0430\u043b\u043b\u043e\u0432 \u043d\u0430 5:\" << endl;\n    for (auto& [key, value] : m) {\n        value += 5;\n    }\n    for (const auto& [key, value] : m) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // extract (C++17) - \u0438\u0437\u0432\u043b\u0435\u0447\u0435\u043d\u0438\u0435 \u0443\u0437\u043b\u0430\n    auto node = m.extract(\"\u041a\u043e\u0437\u043b\u043e\u0432\");\n    if (!node.empty()) {\n        node.key() = \"\u041a\u043e\u0437\u043b\u043e\u0432\u0441\u043a\u0438\u0439\";  // \u043c\u0435\u043d\u044f\u0435\u043c \u043a\u043b\u044e\u0447\n        m.insert(move(node));\n    }\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 extract \u0438 \u0441\u043c\u0435\u043d\u044b \u043a\u043b\u044e\u0447\u0430 \u041a\u043e\u0437\u043b\u043e\u0432->\u041a\u043e\u0437\u043b\u043e\u0432\u0441\u043a\u0438\u0439:\" << endl;\n    for (const auto& [key, value] : m) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // clear\n    m.clear();\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 clear(): size=\" << m.size() << endl;\n    \n    cout << \"\\n\u0425\u0410\u0420\u0410\u041a\u0422\u0415\u0420\u0418\u0421\u0422\u0418\u041a\u0418 map:\" << endl;\n    cout << \"- \u0425\u0440\u0430\u043d\u0438\u0442 \u043f\u0430\u0440\u044b \u043a\u043b\u044e\u0447:\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435\" << endl;\n    cout << \"- \u041a\u043b\u044e\u0447\u0438 \u0443\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b \u0438 \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u044b\" << endl;\n    cout << \"- \u0414\u043e\u0441\u0442\u0443\u043f \u043f\u043e \u043a\u043b\u044e\u0447\u0443: O(log n)\" << endl;\n    cout << \"- operator[] \u0441\u043e\u0437\u0434\u0430\u0451\u0442 \u044d\u043b\u0435\u043c\u0435\u043d\u0442 \u0435\u0441\u043b\u0438 \u043a\u043b\u044e\u0447\u0430 \u043d\u0435\u0442\" << endl;\n    \n    return 0;\n}\n```\n\n### 6. std::multimap\n```cpp\n#include <iostream>\n#include <map>\n#include <string>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    multimap<string, int> mm;\n    \n    cout << \"=== std::multimap (\u041c\u0423\u041b\u042c\u0422\u0418\u0421\u041b\u041e\u0412\u0410\u0420\u042c - \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u043a\u043b\u044e\u0447\u0435\u0439 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u044b) ===\" << endl;\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430 (\u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u043a\u043b\u044e\u0447\u0435\u0439 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u044b!)\n    mm.insert({\"\u0418\u0432\u0430\u043d\u043e\u0432\", 85});\n    mm.insert({\"\u041f\u0435\u0442\u0440\u043e\u0432\", 92});\n    mm.insert({\"\u0418\u0432\u0430\u043d\u043e\u0432\", 78});  // \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442 \u043a\u043b\u044e\u0447\u0430!\n    mm.insert({\"\u0418\u0432\u0430\u043d\u043e\u0432\", 95});  // \u0435\u0449\u0451 \u043e\u0434\u0438\u043d\n    mm.emplace(\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\", 88);\n    mm.insert({\"\u041f\u0435\u0442\u0440\u043e\u0432\", 73});\n    \n    cout << \"\u0421\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435 (\u043a\u043b\u044e\u0447\u0438 \u043c\u043e\u0433\u0443\u0442 \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u0442\u044c\u0441\u044f):\" << endl;\n    cout << setw(15) << \"\u0424\u0430\u043c\u0438\u043b\u0438\u044f\" << \" | \" << \"\u0411\u0430\u043b\u043b\" << endl;\n    cout << string(25, '-') << endl;\n    for (const auto& [key, value] : mm) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    cout << \"\u0420\u0430\u0437\u043c\u0435\u0440: \" << mm.size() << endl;\n    \n    // count (\u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c > 1)\n    cout << \"\\ncount(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\"): \" << mm.count(\"\u0418\u0432\u0430\u043d\u043e\u0432\") << endl;\n    cout << \"count(\\\"\u041f\u0435\u0442\u0440\u043e\u0432\\\"): \" << mm.count(\"\u041f\u0435\u0442\u0440\u043e\u0432\") << endl;\n    cout << \"count(\\\"\u041d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0439\\\"): \" << mm.count(\"\u041d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u044b\u0439\") << endl;\n    \n    // find \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u043f\u0435\u0440\u0432\u044b\u0439 \u043d\u0430\u0439\u0434\u0435\u043d\u043d\u044b\u0439\n    auto it = mm.find(\"\u0418\u0432\u0430\u043d\u043e\u0432\");\n    cout << \"find(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\"): \" << it->first << \" = \" << it->second << endl;\n    \n    // equal_range\n    auto range = mm.equal_range(\"\u0418\u0432\u0430\u043d\u043e\u0432\");\n    cout << \"\\nequal_range(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\"):\" << endl;\n    for (auto it = range.first; it != range.second; ++it) {\n        cout << \"  \" << it->first << \" = \" << it->second << endl;\n    }\n    \n    // lower_bound / upper_bound\n    cout << \"\\nlower_bound(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\"): \" << mm.lower_bound(\"\u0418\u0432\u0430\u043d\u043e\u0432\")->second << endl;\n    auto ub = mm.upper_bound(\"\u0418\u0432\u0430\u043d\u043e\u0432\");\n    if (ub != mm.end()) {\n        cout << \"upper_bound(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\"): \" << ub->first << \" = \" << ub->second << endl;\n    }\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043f\u043e \u043a\u043b\u044e\u0447\u0443 (\u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415 \u0432\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f!)\n    mm.erase(\"\u0418\u0432\u0430\u043d\u043e\u0432\");\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase(\\\"\u0418\u0432\u0430\u043d\u043e\u0432\\\") - \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415:\" << endl;\n    for (const auto& [key, value] : mm) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043e\u0434\u043d\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430 \u043f\u043e \u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u0443\n    mm.insert({\"\u041f\u0435\u0442\u0440\u043e\u0432\", 100});\n    mm.insert({\"\u041f\u0435\u0442\u0440\u043e\u0432\", 100});\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0435\u0449\u0451 \u0434\u0432\u0443\u0445 \u041f\u0435\u0442\u0440\u043e\u0432:\" << endl;\n    for (const auto& [key, value] : mm) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    it = mm.find(\"\u041f\u0435\u0442\u0440\u043e\u0432\");\n    if (it != mm.end()) mm.erase(it);  // \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u0438\u043d\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase(find(\\\"\u041f\u0435\u0442\u0440\u043e\u0432\\\")) - \u0443\u0434\u0430\u043b\u0451\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u041e\u0414\u0418\u041d:\" << endl;\n    for (const auto& [key, value] : mm) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439\n    cout << \"\\n\u0423\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u0438\u0435 \u0432\u0441\u0435\u0445 \u0431\u0430\u043b\u043b\u043e\u0432 \u043d\u0430 5:\" << endl;\n    for (auto& [key, value] : mm) {\n        value += 5;\n    }\n    for (const auto& [key, value] : mm) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    // extract (C++17)\n    cout << \"\\nextract \u0438 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u043a\u043b\u044e\u0447\u0430:\" << endl;\n    auto node = mm.extract(\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\");\n    if (!node.empty()) {\n        node.key() = \"\u0421\u0438\u0434\u043e\u0440\u0435\u043d\u043a\u043e\";\n        mm.insert(move(node));\n    }\n    for (const auto& [key, value] : mm) {\n        cout << setw(15) << key << \" | \" << value << endl;\n    }\n    \n    cout << \"\\n\u0425\u0410\u0420\u0410\u041a\u0422\u0415\u0420\u0418\u0421\u0422\u0418\u041a\u0418 multimap:\" << endl;\n    cout << \"- \u0414\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u043a\u043b\u044e\u0447\u0435\u0439\" << endl;\n    cout << \"- \u041d\u0435\u0442 operator[] (\u043a\u0430\u043a\u043e\u0439 \u0438\u0437 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u043e\u0432 \u0432\u0435\u0440\u043d\u0443\u0442\u044c?)\" << endl;\n    cout << \"- \u041d\u0435\u0442 at()\" << endl;\n    cout << \"- erase(\u043a\u043b\u044e\u0447) \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415 \u0432\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f\" << endl;\n    cout << \"- erase(\u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440) \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u041e\u0414\u0418\u041d \u044d\u043b\u0435\u043c\u0435\u043d\u0442\" << endl;\n    \n    return 0;\n}\n```\n\n### 7. std::unordered_set\n```cpp\n#include <iostream>\n#include <unordered_set>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    unordered_set<int> us;\n    \n    cout << \"=== std::unordered_set (\u0425\u0415\u0428-\u041c\u041d\u041e\u0416\u0415\u0421\u0422\u0412\u041e - \u0443\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435, \u043d\u0435 \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u044b) ===\" << endl;\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430\n    us.insert(50);\n    us.insert(30);\n    us.insert(70);\n    us.insert(30);  // \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442 - \u043d\u0435 \u0434\u043e\u0431\u0430\u0432\u0438\u0442\u0441\u044f\n    us.insert(10);\n    us.insert(90);\n    us.emplace(40);\n    \n    cout << \"\u041f\u043e\u0441\u043b\u0435 \u0432\u0441\u0442\u0430\u0432\u043a\u0438 {50,30,70,30,10,90,40}:\" << endl;\n    for (int val : us) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    cout << \"\u041f\u043e\u0440\u044f\u0434\u043e\u043a \u041d\u0415 \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d (\u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u0445\u0435\u0448\u0430)!\" << endl;\n    \n    // \u041c\u0435\u0442\u043e\u0434\u044b\n    cout << \"\\n\u041c\u0435\u0442\u043e\u0434\u044b unordered_set:\" << endl;\n    cout << \"size(): \" << us.size() << endl;\n    cout << \"max_size(): \" << us.max_size() << endl;\n    cout << \"empty(): \" << (us.empty() ? \"true\" : \"false\") << endl;\n    \n    // bucket_count, bucket_size, bucket\n    cout << \"bucket_count(): \" << us.bucket_count() << endl;\n    for (size_t i = 0; i < us.bucket_count(); i++) {\n        if (us.bucket_size(i) > 0) {\n            cout << \"  bucket[\" << i << \"] size = \" << us.bucket_size(i) << \": \";\n            for (auto it = us.begin(i); it != us.end(i); ++it) {\n                cout << *it << \" \";\n            }\n            cout << endl;\n        }\n    }\n    \n    // load_factor\n    cout << \"load_factor(): \" << us.load_factor() << endl;\n    cout << \"max_load_factor(): \" << us.max_load_factor() << endl;\n    \n    // rehash \u0438 reserve\n    us.rehash(20);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 rehash(20): bucket_count=\" << us.bucket_count() << endl;\n    us.reserve(50);\n    cout << \"\u041f\u043e\u0441\u043b\u0435 reserve(50): bucket_count=\" << us.bucket_count() << endl;\n    \n    // find\n    auto it = us.find(30);\n    if (it != us.end()) cout << \"find(30): \u043d\u0430\u0439\u0434\u0435\u043d = \" << *it << endl;\n    \n    // count\n    cout << \"count(30): \" << us.count(30) << endl;\n    cout << \"count(100): \" << us.count(100) << endl;\n    \n    // equal_range\n    auto range = us.equal_range(30);\n    cout << \"equal_range(30): \";\n    for (auto it = range.first; it != range.second; ++it) {\n        cout << *it << \" \";\n    }\n    cout << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435\n    us.erase(40);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase(40): \";\n    for (int val : us) cout << val << \" \";\n    cout << endl;\n    \n    // \u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u041d\u0415\u0412\u041e\u0417\u041c\u041e\u0416\u041d\u041e (\u0442\u043e\u043b\u044c\u043a\u043e \u0443\u0434\u0430\u043b\u0438\u0442\u044c \u0438 \u0432\u0441\u0442\u0430\u0432\u0438\u0442\u044c)\n    cout << \"\\n\u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435: \u043d\u0435\u043b\u044c\u0437\u044f \u043c\u043e\u0434\u0438\u0444\u0438\u0446\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b!\" << endl;\n    cout << \"\u041d\u0443\u0436\u043d\u043e \u0441\u0442\u0435\u0440\u0435\u0442\u044c \u0438 \u0432\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043d\u043e\u0432\u044b\u0439.\" << endl;\n    \n    // clear\n    us.clear();\n    cout << \"\u041f\u043e\u0441\u043b\u0435 clear(): size=\" << us.size() << endl;\n    \n    cout << \"\\n\u0425\u0410\u0420\u0410\u041a\u0422\u0415\u0420\u0418\u0421\u0422\u0418\u041a\u0418 unordered_set:\" << endl;\n    cout << \"- \u0423\u043d\u0438\u043a\u0430\u043b\u044c\u043d\u044b\u0435 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b\" << endl;\n    cout << \"- \u041f\u043e\u0440\u044f\u0434\u043e\u043a \u043d\u0435 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0451\u043d (\u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u0445\u0435\u0448\u0430)\" << endl;\n    cout << \"- \u0412 \u0441\u0440\u0435\u0434\u043d\u0435\u043c O(1) \u0434\u043b\u044f \u0432\u0441\u0442\u0430\u0432\u043a\u0438/\u043f\u043e\u0438\u0441\u043a\u0430/\u0443\u0434\u0430\u043b\u0435\u043d\u0438\u044f\" << endl;\n    cout << \"- \u0412 \u0445\u0443\u0434\u0448\u0435\u043c \u0441\u043b\u0443\u0447\u0430\u0435 O(n)\" << endl;\n    \n    // \u0421\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u0435 \u0441 set\n    cout << \"\\n\u0421\u0420\u0410\u0412\u041d\u0415\u041d\u0418\u0415 set vs unordered_set:\" << endl;\n    cout << \"set:       \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d, O(log n), \u0431\u043e\u043b\u044c\u0448\u0435 \u043f\u0430\u043c\u044f\u0442\u0438 \u043d\u0430 \u0443\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u0438 \u0434\u0435\u0440\u0435\u0432\u0430\" << endl;\n    cout << \"unordered: \u043d\u0435 \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d, O(1) \u0432 \u0441\u0440\u0435\u0434\u043d\u0435\u043c, \u0431\u043e\u043b\u044c\u0448\u0435 \u043f\u0430\u043c\u044f\u0442\u0438 \u043d\u0430 \u0445\u0435\u0448-\u0442\u0430\u0431\u043b\u0438\u0446\u0443\" << endl;\n    \n    return 0;\n}\n```\n\n### 8. std::unordered_multiset\n```cpp\n#include <iostream>\n#include <unordered_set>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    unordered_multiset<int> ums;\n    \n    cout << \"=== std::unordered_multiset (\u0425\u0415\u0428-\u041c\u0423\u041b\u042c\u0422\u0418\u041c\u041d\u041e\u0416\u0415\u0421\u0422\u0412\u041e) ===\" << endl;\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430 (\u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u044b)\n    ums.insert(30);\n    ums.insert(10);\n    ums.insert(50);\n    ums.insert(30);  // \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442 \u0421\u041e\u0425\u0420\u0410\u041d\u042f\u0415\u0422\u0421\u042f\n    ums.insert(30);  // \u0435\u0449\u0451\n    ums.insert(20);\n    ums.emplace(50);\n    \n    cout << \"\u041f\u043e\u0441\u043b\u0435 \u0432\u0441\u0442\u0430\u0432\u043a\u0438 {30,10,50,30,30,20,50}:\" << endl;\n    for (int val : ums) {\n        cout << setw(4) << val;\n    }\n    cout << endl;\n    cout << \"\u0420\u0430\u0437\u043c\u0435\u0440: \" << ums.size() << endl;\n    \n    // count\n    cout << \"\\ncount(30): \" << ums.count(30) << \" (\u0442\u0440\u0438 \u0448\u0442\u0443\u043a\u0438)\" << endl;\n    cout << \"count(10): \" << ums.count(10) << endl;\n    \n    // equal_range\n    auto range = ums.equal_range(30);\n    cout << \"equal_range(30): \";\n    for (auto it = range.first; it != range.second; ++it) {\n        cout << *it << \" \";\n    }\n    cout << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043f\u043e \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044e (\u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415!)\n    ums.erase(30);\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 erase(30) - \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0412\u0421\u0415 30:\" << endl;\n    for (int val : ums) cout << setw(4) << val;\n    cout << endl;\n    \n    // \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u043e\u0434\u043d\u043e\u0433\u043e \u043f\u043e \u0438\u0442\u0435\u0440\u0430\u0442\u043e\u0440\u0443\n    auto it = ums.find(50);\n    if (it != ums.end()) ums.erase(it);\n    cout << \"\u041f\u043e\u0441\u043b\u0435 erase(find(50)) - \u0443\u0434\u0430\u043b\u0451\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u041e\u0414\u0418\u041d 50:\" << endl;\n    for (int val : ums) cout << setw(4) << val;\n    cout << endl;\n    \n    // bucket \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044f\n    cout << \"\\nbucket_count: \" << ums.bucket_count() << endl;\n    cout << \"load_factor: \" << ums.load_factor() << endl;\n    \n    // rehash\n    ums.rehash(30);\n    cout << \"\u041f\u043e\u0441\u043b\u0435 rehash(30): bucket_count=\" << ums.bucket_count() << endl;\n    \n    // clear\n    ums.clear();\n    cout << \"\\n\u041f\u043e\u0441\u043b\u0435 clear(): size=\" << ums.size() << endl;\n    \n    cout << \"\\n\u0425\u0410\u0420\u0410\u041a\u0422\u0415\u0420\u0418\u0421\u0422\u0418\u041a\u0418 unordered_multiset:\" << endl;\n    cout << \"- \u0414\u043e\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0434\u0443\u0431\u043b\u0438\u043a\u0430\u0442\u044b\" << endl;\n    cout << \"- \u041f\u043e\u0440\u044f\u0434\u043e\u043a \u043d\u0435 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0451\u043d\" << endl;\n    cout << \"- O(1) \u0432 \u0441\u0440\u0435\u0434\u043d\u0435\u043c \u0434\u043b\u044f \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u0439\" << endl;\n    \n    return 0;\n}\n```\n\n### 9. std::unordered_map\n```cpp\n#include <iostream>\n#include <unordered_map>\n#include <string>\n#include <iomanip>\nusing namespace std;\n\nint main() {\n    setlocale(LC_ALL, \"Russian\");\n    \n    unordered_map<string, int> um;\n    \n    cout << \"=== std::unordered_map (\u0425\u0415\u0428-\u0421\u041b\u041e\u0412\u0410\u0420\u042c) ===\" << endl;\n    \n    // \u0412\u0441\u0442\u0430\u0432\u043a\u0430\n    um[\"\u0418\u0432\u0430\u043d\u043e\u0432\"] = 85;\n    um[\"\u041f\u0435\u0442\u0440\u043e\u0432\"] = 92;\n    um.insert({\"\u0421\u0438\u0434\u043e\u0440\u043e\u0432\", 78});\n    um.emplace(\"\u041a\u043e\u0437\u043b\u043e\u0432\", 95);\n    \n    // \u0414\u0443\u0431\u043b\u0438\u043a\u0430\u0442 \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442\n    um[\"\u0418\u0432\u0430\u043d\u043e\u0432\"] = 90;\n    \n    cout << \"\u0421\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435 (\u043f\u043e\u0440\u044f\u0434\u043e\u043a \u043d\u043
